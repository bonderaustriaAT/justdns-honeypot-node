# JustDNS honeypot node: Cowrie (SSH), OpenCanary (FTP, Telnet, MySQL, RDP, VNC,
# Redis), the web-decoy (HTTP, Docker-API, Elasticsearch, with randomized
# "vulnerable" personas), the shipper that forwards attacker attempts to the
# JustDNS intake, and a live view (nodeui, on http://<node-ip>:8090). Copy
# .env.example to .env, then:
#
#   docker compose up -d
#
# Then point external SSH traffic at this host. Either map the honeypot to
# port 22 on the host (set COWRIE_SSH_PORT=22 in .env, only on a box where
# port 22 is free), or forward WAN tcp/22 to this host's 2222 on your router.

services:
  cowrie:
    # Pinned tag, not :latest, so a node stays reproducible. Bump deliberately.
    image: cowrie/cowrie:3.1.7
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${COWRIE_SSH_PORT:-2222}:2222"
    volumes:
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie

  # Protocol decoys next to Cowrie: FTP, Telnet, MySQL, RDP, VNC, Redis. Fake
  # implementations, they log attempts and never run a real service. Built once
  # from ./opencanary (OpenCanary has no official image). HTTP is handled by the
  # richer web-decoy below, not here. Host ports map 1:1; forward them from the
  # WAN as shown in the README port table.
  opencanary:
    build: ./opencanary
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${FTP_PORT:-21}:21"
      - "${TELNET_PORT:-23}:23"
      - "${MYSQL_PORT:-3306}:3306"
      - "${RDP_PORT:-3389}:3389"
      - "${VNC_PORT:-5900}:5900"
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./opencanary/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - opencanary-logs:/var/tmp

  # Web-decoy for the HTTP family: a plain HTTP site (80, 8080), a fake Docker
  # API (2375) and a fake Elasticsearch (9200). It shows deliberately old,
  # "vulnerable" looking versions and answers the paths scanners probe, but it
  # is PURE DECOY: it runs nothing, never touches the filesystem, and only logs.
  # The web persona is rolled per node by randomize-node.sh (WEBDECOY_PERSONA).
  webdecoy:
    image: python:3.12-slim
    restart: unless-stopped
    mem_limit: 128m
    environment:
      WEBDECOY_WEB_PORTS: "80,8080"
      WEBDECOY_DOCKER_PORT: "2375"
      WEBDECOY_ELASTIC_PORT: "9200"
      WEBDECOY_PERSONA: ${WEBDECOY_PERSONA:-}
      WEBDECOY_LOG: /var/tmp/webdecoy.log
    volumes:
      - ./webdecoy/webdecoy.py:/app/webdecoy.py:ro
      - webdecoy-logs:/var/tmp
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_ALT_PORT:-8080}:8080"
      - "${DOCKER_DECOY_PORT:-2375}:2375"
      - "${ELASTIC_DECOY_PORT:-9200}:9200"
    command: ["python", "/app/webdecoy.py"]

  shipper:
    image: python:3.12-slim
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - cowrie
      - opencanary
      - webdecoy
    environment:
      SENSOR_ID: ${SENSOR_ID:-}
      OPERATOR: ${OPERATOR:-}
      TOKEN: ${TOKEN:-}
      INTAKE_URL: ${INTAKE_URL:-https://intake.justdns.justfuture.at}
      COWRIE_LOG: /logs/cowrie/cowrie.json*
      OC_LOG: /logs/opencanary/opencanary.log*
      WEBDECOY_LOG: /logs/webdecoy/webdecoy.log*
      STATE_FILE: /state/state.json
      BATCH: "500"
      SHIPPER_INTERVAL: "120"
    volumes:
      - ./shipper/shipper.py:/app/shipper.py:ro
      - cowrie-logs:/logs/cowrie:ro
      - opencanary-logs:/logs/opencanary:ro
      - webdecoy-logs:/logs/webdecoy:ro
      - shipper-state:/state
    command: ["sh", "-c", "while true; do python /app/shipper.py --config /dev/null; sleep $$SHIPPER_INTERVAL; done"]

  # Live view of attacks on THIS node, incl. tried credentials. Reachable from
  # the internal network at http://<node-ip>:8090 (8080 is an attacker-facing
  # decoy port). It shows attacker credentials, so keep it on the internal
  # network and do not forward it from the WAN. For remote access set
  # NODEUI_TOKEN and put TLS in front.
  nodeui:
    image: python:3.12-slim
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - cowrie
    environment:
      NODEUI_BIND: 0.0.0.0
      NODEUI_TOKEN: ${NODEUI_TOKEN:-}
      COWRIE_LOG: /logs/cowrie/cowrie.json*
      OC_LOG: /logs/opencanary/opencanary.log*
    volumes:
      - ./nodeui/nodeui.py:/app/nodeui.py:ro
      - cowrie-logs:/logs/cowrie:ro
      - opencanary-logs:/logs/opencanary:ro
    ports:
      - "${NODEUI_PORT:-8090}:8080"
    command: ["python", "/app/nodeui.py"]

volumes:
  cowrie-logs:
  opencanary-logs:
  webdecoy-logs:
  shipper-state:
