# JustDNS honeypot node: Cowrie (SSH) plus OpenCanary (FTP, Telnet, HTTP,
# MySQL, RDP, VNC), the shipper that forwards attacker attempts to the JustDNS
# intake, and a live view (nodeui, on http://<node-ip>:8080). Copy
# .env.example to .env, then:
#
#   docker compose up -d
#
# Then point external SSH traffic at this host. Either map the honeypot to
# port 22 on the host (set COWRIE_SSH_PORT=22 in .env, only on a box where
# port 22 is free), or forward WAN tcp/22 to this host's 2222 on your router.

services:
  cowrie:
    image: cowrie/cowrie:latest
    restart: unless-stopped
    ports:
      - "${COWRIE_SSH_PORT:-2222}:2222"
    volumes:
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie

  # Multi-service decoy next to Cowrie: FTP, Telnet, HTTP, MySQL, RDP, VNC.
  # Built once from ./opencanary (OpenCanary has no official image). The host
  # ports map 1:1 so attackers hitting those ports land here; forward them from
  # the WAN as shown in the README port table.
  opencanary:
    build: ./opencanary
    restart: unless-stopped
    ports:
      - "${FTP_PORT:-21}:21"
      - "${TELNET_PORT:-23}:23"
      - "${OC_HTTP_PORT:-80}:80"
      - "${MYSQL_PORT:-3306}:3306"
      - "${RDP_PORT:-3389}:3389"
      - "${VNC_PORT:-5900}:5900"
    volumes:
      - ./opencanary/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - opencanary-logs:/var/tmp

  shipper:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
      - cowrie
      - opencanary
    environment:
      SENSOR_ID: ${SENSOR_ID:-}
      OPERATOR: ${OPERATOR:-}
      TOKEN: ${TOKEN:-}
      INTAKE_URL: ${INTAKE_URL:-https://intake.justdns.justfuture.at}
      COWRIE_LOG: /logs/cowrie/cowrie.json*
      OC_LOG: /logs/opencanary/opencanary.log*
      STATE_FILE: /state/state.json
      BATCH: "500"
      SHIPPER_INTERVAL: "120"
    volumes:
      - ./shipper/shipper.py:/app/shipper.py:ro
      - cowrie-logs:/logs/cowrie:ro
      - opencanary-logs:/logs/opencanary:ro
      - shipper-state:/state
    command: ["sh", "-c", "while true; do python /app/shipper.py --config /dev/null; sleep $$SHIPPER_INTERVAL; done"]

  # Live view of attacks on THIS node, incl. tried credentials. Reachable from
  # the internal network at http://<node-ip>:8080. It shows attacker
  # credentials, so keep it on the internal network and do not forward it from
  # the WAN. For remote access set NODEUI_TOKEN and put TLS in front.
  nodeui:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
      - cowrie
    environment:
      NODEUI_BIND: 0.0.0.0
      NODEUI_TOKEN: ${NODEUI_TOKEN:-}
      COWRIE_LOG: /logs/cowrie/cowrie.json*
      OC_LOG: /logs/opencanary/opencanary.log*
    volumes:
      - ./nodeui/nodeui.py:/app/nodeui.py:ro
      - cowrie-logs:/logs/cowrie:ro
      - opencanary-logs:/logs/opencanary:ro
    ports:
      - "${NODEUI_PORT:-8080}:8080"
    command: ["python", "/app/nodeui.py"]

volumes:
  cowrie-logs:
  opencanary-logs:
  shipper-state:
