# Cowrie SSH honeypot config for a JustDNS honeypot node.
# Auth: AuthFailFirst (custom class, injected into cowrie.core.auth by
# scripts/install-auth-failfirst.sh). The first N=2 login attempts from each
# source IP fail (cowrie.login.failed, source IP captured = brute-force signal),
# then every further login from that IP is accepted, so the attacker reaches the
# emulated shell and the nachlade commands (wget/curl/busybox) are captured. It
# counts ALL attempts (including identical credentials) and never locks out a
# returning IP (unlike AuthRandom). If the class is missing (e.g. after a cowrie
# self-update) cowrie falls back to UserDB + userdb.txt - re-run the installer.
#
# Do not reuse the same hostname and SSH version on several nodes, otherwise
# they are easy to fingerprint as the same fleet. Run scripts/randomize-node.sh
# once before the first start to roll both to random, realistic values.

[honeypot]
hostname = srv-web-01
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
state_path = var/lib/cowrie
# AuthFailFirst: fail the first N attempts per source IP, then accept every
# further login from that IP (see scripts/install-auth-failfirst.sh). N is the
# first value of auth_class_parameters.
auth_class = AuthFailFirst
auth_class_parameters = 2

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
# SSH banner shown to clients. Keep it a plausible real version, vary it per
# node (randomize-node.sh does this).
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

# Telnet-Fake-Shell (gleiche AuthFailFirst-Auth wie SSH). Telnet ist der Haupt-
# Vektor fuer IoT-Botnets: nach dem Login kommen busybox/wget/tftp-Nachlade-
# Kommandos. Cowrie lauscht non-root auf 2223; den WAN-Port 23 direkt auf 2223
# forwarden (wie SSH 22->2222). Laeuft auf der Node schon ein Telnet-Dienst auf
# 23 (z.B. OpenCanary), diesen deaktivieren und 23->2223 lokal umleiten
# (scripts/telnet-redirect.sh).
[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
