# Cowrie SSH honeypot config for a JustDNS honeypot node.
# Deny-all: every login attempt fails, so each try is logged as
# cowrie.login.failed and the source IP is captured. Telnet is off.
#
# Change "hostname" to something that fits your box. Do not reuse the
# default on several nodes, otherwise they are easy to fingerprint.

[honeypot]
hostname = srv-web-01
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
state_path = var/lib/cowrie

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
