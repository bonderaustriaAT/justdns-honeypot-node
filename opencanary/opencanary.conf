{
    "device.node_id": "justdns-node",
    "ip.ignorelist": [],
    "logtype.ignorelist": [],
    "git.enabled": false,
    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready",
    "http.banner": "Apache/2.2.22 (Ubuntu)",
