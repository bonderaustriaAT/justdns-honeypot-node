    "rdp.enabled": true,
    "rdp.port": 3389,
    "sip.enabled": false,
    "snmp.enabled": false,
    "ntp.enabled": false,
    "tftp.enabled": false,
    "tcpbanner.enabled": false,
    "telnet.enabled": true,
    "telnet.port": 23,
    "telnet.banner": "",
    "mssql.enabled": false,
    "vnc.enabled": true,
