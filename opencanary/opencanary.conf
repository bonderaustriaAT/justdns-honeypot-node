    "http.port": 80,
    "http.skin": "nasLogin",
    "https.enabled": false,
    "httpproxy.enabled": false,
    "llmnr.enabled": false,
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {
